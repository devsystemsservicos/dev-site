<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Logo trace</title>
    <style>
      body { margin: 0; background: #fff; }
      img { display: block; }
    </style>
  </head>
  <body>
    <img id="src" src="./logo-original.png" alt="" />
    <script>
      // Expose a helper the automation can call to sample pixels.
      window.__ready = new Promise((resolve) => {
        const img = document.getElementById("src");
        const go = () => {
          const c = document.createElement("canvas");
          c.width = img.naturalWidth;
          c.height = img.naturalHeight;
          const ctx = c.getContext("2d", { willReadFrequently: true });
          ctx.drawImage(img, 0, 0);
          window.__canvas = c;
          window.__ctx = ctx;
          window.__size = { w: c.width, h: c.height };
          resolve({ w: c.width, h: c.height });
        };
        if (img.complete && img.naturalWidth) go();
        else img.onload = go;
      });
    </script>
  </body>
</html>
